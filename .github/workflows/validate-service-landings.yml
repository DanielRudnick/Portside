name: Validate service landings

on:
  push:
    branches:
      - main
      - feat/new-service-site
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate landing contracts
        run: python tests/test_service_landings.py
